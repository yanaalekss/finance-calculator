name: Finance Calculator CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -v

  deploy:
    name: Deploy to Ubuntu server
    needs: test
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Prepare deployment directory
        run: |
          mkdir -p "$HOME/finance-calculator-prod"

      - name: Deploy application
        run: |
          cp app.py requirements.txt "$HOME/finance-calculator-prod/"

      - name: Show deployed files
        run: |
          ls -la "$HOME/finance-calculator-prod"